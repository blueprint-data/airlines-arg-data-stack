name: export-bigquery

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/export_to_gcs.py'
      - '.github/workflows/export_bigquery.yml'
      - 'requirements.txt'

jobs:
  export-data:
    name: Export BigQuery Data
    runs-on: ubuntu-latest
    env:
      BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
      GCP_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
      EXPORT_BQ_DATASET_ID: ${{ secrets.EXPORT_BQ_DATASET_ID || 'marts' }}
      EXPORT_BQ_TABLE_ID: ${{ secrets.EXPORT_BQ_TABLE_ID || 'flights_performance' }}
      EXPORT_BQ_DATE_COLUMN: ${{ secrets.EXPORT_BQ_DATE_COLUMN || 'flight_date' }}
      EXPORT_BQ_LOOKBACK_DAYS: ${{ secrets.EXPORT_BQ_LOOKBACK_DAYS || '30' }}
      EXPORT_BQ_LIMIT: ${{ secrets.EXPORT_BQ_LIMIT || '10000' }}
      EXPORT_GCS_BUCKET_NAME: ${{ secrets.EXPORT_GCS_BUCKET_NAME || secrets.GCS_BUCKET_NAME }}
      EXPORT_GCS_BLOB_PATH: ${{ secrets.EXPORT_GCS_BLOB_PATH || 'data/flights_performance.json' }}
      EXPORT_TABLE_MAP: >-
        {"public_headline":"prod/exports/headline.json",
        "public_airline_breakdown":"prod/exports/airline_breakdown.json",
        "public_tops":"prod/exports/tops.json",
        "public_bucket_distribution":"prod/exports/bucket_distribution.json",
        "public_daily_status":"prod/exports/daily_status.json"}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-export-service-account.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt

      - name: Decode GCP credentials
        run: |
          printf '%s' "${{ secrets.MELTANO_GOOGLE_APPLICATION_CREDENTIALS }}" | base64 -di > "${GOOGLE_APPLICATION_CREDENTIALS}"
          chmod 600 "${GOOGLE_APPLICATION_CREDENTIALS}"

      - name: Export data to GCS
        run: python scripts/export_to_gcs.py
