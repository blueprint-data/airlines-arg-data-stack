name: signed-urls

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  generate-signed-urls:
    name: Generate Signed URL Manifest
    runs-on: ubuntu-latest
    env:
      SIGNED_GCS_BUCKET_NAME: ${{ secrets.EXPORT_GCS_BUCKET_NAME || secrets.GCS_BUCKET_NAME }}
      SIGNED_MANIFEST_PATH: prod/exports/manifest.json
      SIGNED_URL_EXPIRATION_DAYS: 7
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-signing-service-account.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt

      - name: Decode GCP credentials
        run: |
          printf '%s' "${{ secrets.MELTANO_GOOGLE_APPLICATION_CREDENTIALS }}" | base64 -di > "${GOOGLE_APPLICATION_CREDENTIALS}"
          chmod 600 "${GOOGLE_APPLICATION_CREDENTIALS}"

      - name: Generate signed manifest
        run: python scripts/generate_signed_manifest.py
