version: 2

models:
  - name: airport_operations
    description: |
      Operational statistics aggregated by airport.
      Provides insights into airport performance, peak times, and connectivity.

      **Business Value:**
      - Understand airport capacity utilization
      - Identify peak operational hours
      - Compare performance across airports
      - Analyze connectivity and route networks

      **Grain:** One row per airport

      **Key Metrics:**
      - total_departures: Total number of departure flights
      - total_arrivals: Total number of arrival flights
      - on_time_departure_percentage: Percentage of on-time departures
      - peak_departure_hour: Most common hour for departures
    columns:
      - name: airport_code
        description: Airport IATA code (e.g., "AEP" for Aeroparque Jorge Newbery)
        tests:
          - unique
          - not_null
      - name: total_departures
        description: Total number of departure flights
        tests:
          - not_null
      - name: total_arrivals
        description: Total number of arrival flights
        tests:
          - not_null
      - name: avg_departure_delay_minutes
        description: Average delay in minutes for departures
      - name: avg_arrival_delay_minutes
        description: Average delay in minutes for arrivals
      - name: avg_overall_delay_minutes
        description: Average delay in minutes across all flights
      - name: total_cancelled_flights
        description: Total number of cancelled flights
        tests:
          - not_null
      - name: total_delayed_flights
        description: Total number of delayed flights (>15 minutes)
        tests:
          - not_null
      - name: total_on_time_flights
        description: Total number of on-time flights (≤15 minutes)
        tests:
          - not_null
      - name: unique_airlines
        description: Number of unique airlines operating at this airport
        tests:
          - not_null
      - name: unique_destinations
        description: Number of unique connected airports
        tests:
          - not_null
      - name: peak_departure_hour
        description: Most common hour (0-23) for departures
      - name: peak_arrival_hour
        description: Most common hour (0-23) for arrivals
      - name: on_time_departure_percentage
        description: Percentage of on-time departures (0-100)
        tests:
          - not_null
      - name: delayed_departure_percentage
        description: Percentage of delayed departures (0-100)
        tests:
          - not_null
      - name: cancellation_rate
        description: Percentage of cancelled flights (0-100)
        tests:
          - not_null
      - name: on_time_rank
        description: Rank based on on-time performance (1 = best, lower is better)
        tests:
          - not_null
      - name: avg_delay_rank
        description: Rank based on average delay (1 = best, lower is better)
        tests:
          - not_null
      - name: volume_rank
        description: Rank based on flight volume (1 = busiest, lower is better)
        tests:
          - not_null
      - name: first_flight_date
        description: First date this airport appeared in the data
      - name: last_flight_date
        description: Most recent date this airport appeared in the data
      - name: dbt_updated_at
        description: Timestamp of the last transformation
        tests:
          - not_null
