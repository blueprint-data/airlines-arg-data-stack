version: 2

models:
  - name: stg_airports
    description: |
      Airport reference data derived from flight records.
      Each row represents an airport with statistics about flights passing through it.
    columns:
      - name: airport_code
        description: Airport IATA code (e.g., "AEP" for Aeroparque Jorge Newbery)
        tests:
          - not_null
      - name: city
        description: City name where the airport is located (requires seed data; null if unavailable)
      - name: first_seen_date
        description: First date this airport appeared in the flight data
      - name: last_seen_date
        description: Most recent date this airport appeared in the flight data
      - name: total_flights
        description: Total number of flights at this airport
        tests:
          - not_null
      - name: unique_airlines
        description: Number of unique airlines operating at this airport
        tests:
          - not_null
      - name: total_arrivals
        description: Total number of arrival flights at this airport
        tests:
          - not_null
      - name: total_departures
        description: Total number of departure flights from this airport
        tests:
          - not_null
      - name: avg_delay_minutes
        description: Average delay in minutes for flights at this airport
      - name: dbt_updated_at
        description: Timestamp of the last transformation
