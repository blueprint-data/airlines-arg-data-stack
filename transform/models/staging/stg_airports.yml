version: 2

models:
  - name: stg_airports
    description: |
      Airport reference data sourced from the airports seed.
      Each row represents a unique airport with location attributes.
    columns:
      - name: airport_code
        description: Airport IATA code (e.g., "AEP" for Aeroparque Jorge Newbery).
        tests:
          - not_null
          - unique
      - name: airport_name
        description: Official airport name.
      - name: city
        description: City name where the airport is located.
        tests:
          - not_null
      - name: region
        description: Province, state, or region for the airport.
      - name: country
        description: Country name where the airport is located.
        tests:
          - not_null
      - name: latitude
        description: Latitude coordinate of the airport.
      - name: longitude
        description: Longitude coordinate of the airport.
      - name: timezone
        description: IANA timezone for the airport.
      - name: is_international
        description: Indicates whether the airport supports international flights.
      - name: is_argentine_airport
        description: Flag for airports located in Argentina.
      - name: dbt_updated_at
        description: Timestamp of the last transformation
